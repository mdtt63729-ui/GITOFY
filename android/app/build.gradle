plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace "com.gitofy.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.gitofy.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Gitofy release is intentionally UNSIGNED. Do not attach a debug/release keystore here.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.webkit:webkit:1.10.0")
    implementation("com.google.android.material:material:1.11.0")
}

// Package the Vite bundle that CI copies into android/app/src/main/assets/web.
tasks.register("copyWebAssets", Sync) {
    from(rootProject.projectDir.parentFile.toPath().resolve("dist").toFile())
    into(file("src/main/assets/web"))
}

tasks.named("preBuild").configure {
    dependsOn("copyWebAssets")
}


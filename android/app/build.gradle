plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// Release signing is read from a temporary signing.properties file that CI writes
// from GitHub Secrets (see docs/signing.md). No keystore, alias or password is
// ever stored in the repository — the file lives in the runner's temp directory
// for the duration of the build only.
def signingPropertiesFile = System.getenv("SIGNING_PROPERTIES_FILE")
def signingProperties = new Properties()
def hasReleaseSigning = false

if (signingPropertiesFile != null && file(signingPropertiesFile).exists()) {
    file(signingPropertiesFile).withInputStream { signingProperties.load(it) }
    def storePath = signingProperties["storeFile"]
    hasReleaseSigning = storePath != null && !storePath.trim().isEmpty() && file(storePath).exists()
}

android {
    namespace "com.gitofy.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.gitofy.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Values come from signing.properties only; nothing is hard-coded here.
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            // A distinct id AND label, so installing the debug build sits next to
            // the signed release as "Gitofy (Debug)" instead of overwriting it.
            applicationIdSuffix ".debug"
            debuggable true
            resValue "string", "app_name", "Gitofy (Debug)"
        }
        release {
            resValue "string", "app_name", "Gitofy"
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.webkit:webkit:1.10.0")
    implementation("androidx.browser:browser:1.8.0")
    implementation("androidx.biometric:biometric:1.2.0-alpha05")
    implementation("com.google.android.material:material:1.11.0")
}

// Package the Vite bundle (repo-root dist/) into android/app/src/main/assets/web.
//
// IMPORTANT: a Sync task wipes everything in the destination that is not in the
// source. If dist/ is missing (e.g. gradle run straight from Android Studio
// without a prior `npm run build`), the old code silently emptied assets/web,
// which produced an APK that showed
//   "Web page not available ... ERR_INVALID_RESPONSE"
// because the WebView had no /web/index.html to load. We now (1) only sync when
// dist/ actually exists, keeping a pre-bundled assets/web intact, and (2) fail
// the build loudly if no bundle is present at all.
def webDistDir = rootProject.projectDir.parentFile.toPath().resolve("dist").toFile()
def webAssetsDir = file("src/main/assets/web")

tasks.register("copyWebAssets", Sync) {
    onlyIf { webDistDir.exists() }
    from(webDistDir)
    into(webAssetsDir)
}

tasks.register("verifyWebAssets") {
    dependsOn("copyWebAssets")
    doLast {
        if (!file("src/main/assets/web/index.html").exists()) {
            throw new GradleException(
                "Web bundle missing: android/app/src/main/assets/web/index.html not found. " +
                "Run `npm install && npm run build` in the project root first (which writes " +
                "dist/ and its integrity.json), or use the CI workflow that builds and copies " +
                "the bundle. Refusing to build an APK with no web assets."
            )
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("copyWebAssets")
    dependsOn("verifyWebAssets")
}

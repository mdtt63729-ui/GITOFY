plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

// Release signing is read from a temporary signing.properties file that CI writes
// from GitHub Secrets (see docs/signing.md). No keystore, alias or password is
// ever stored in the repository — the file lives in the runner's temp directory
// for the duration of the build only.
def signingPropertiesFile = System.getenv("SIGNING_PROPERTIES_FILE")
def signingProperties = new Properties()
def hasReleaseSigning = false

if (signingPropertiesFile != null && file(signingPropertiesFile).exists()) {
    file(signingPropertiesFile).withInputStream { signingProperties.load(it) }
    def storePath = signingProperties["storeFile"]
    hasReleaseSigning = storePath != null && !storePath.trim().isEmpty() && file(storePath).exists()
}

android {
    namespace "com.gitofy.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.gitofy.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Values come from signing.properties only; nothing is hard-coded here.
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.webkit:webkit:1.10.0")
    implementation("androidx.browser:browser:1.8.0")
    implementation("androidx.biometric:biometric:1.2.0-alpha05")
    implementation("com.google.android.material:material:1.11.0")
}

// Package the Vite bundle that CI copies into android/app/src/main/assets/web.
tasks.register("copyWebAssets", Sync) {
    from(rootProject.projectDir.parentFile.toPath().resolve("dist").toFile())
    into(file("src/main/assets/web"))
}

tasks.named("preBuild").configure {
    dependsOn("copyWebAssets")
}

name: Build Signed Release APK

# Builds a SIGNED release APK entirely on GitHub and attaches it to a GitHub
# Release. The signing identity is stable: the keystore is restored from the
# ANDROID_KEYSTORE_BASE64 secret on every run, so every APK shares one signature.
#
# ---------------------------------------------------------------------------
# FIXES in this version (why the release was stuck with an old APK and the new
# one never appeared):
#
#   1. The version is now stamped into android/app/build.gradle from the tag
#      (v1.2.3 -> versionName "1.2.3"). Before this, versionName was hard-coded
#      "1.0.0", so every release APK was named GITOFY-v1.0.0-release.apk and the
#      installed app kept reporting 1.0.0 — which made the in-app updater offer
#      the "same" update forever.
#
#   2. Old *.apk assets are now deleted from the release BEFORE the new APK is
#      uploaded, so the release always carries exactly the newest APK instead of
#      keeping the previous one.
#
#   3. The release is created/updated for both a v* tag push AND a manual
#      "Run workflow", so a manual run no longer silently produces only an
#      artifact with no release.
#
# NOTE: this workflow still requires the four signing secrets (below). If they
# are missing it exits immediately at the first step and NO release is produced —
# which is the most common reason a new APK never shows up. Run the
# "Bootstrap signing secrets" workflow once to create them.
# ---------------------------------------------------------------------------
#
# Required repository secrets (see docs/signing.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# Note: this project ships android/gradlew without a wrapper JAR, so the build
# uses the `gradle` binary provided by gradle/actions/setup-gradle rather than
# `./gradlew`.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing"
            missing=1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"
            missing=1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEY_ALIAS is missing"
            missing=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD is missing"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "❌ Android release signing secrets are incomplete."
            echo "Add them at: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Or run the 'Bootstrap signing secrets' workflow to create them automatically."
            exit 1
          fi
          echo "✅ All four signing secrets are present."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version from tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The version stamped into the APK (versionName) and the release tag
          # must always be the same string, otherwise the app reports a version
          # that does not match the release it came from.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual run: bump the patch of the newest release tag, so versions
            # stay monotonic and always match the published release.
            LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
            if [[ "$LATEST" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              VERSION="1.0.1"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (release tag v${VERSION})"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"
          if [ ! -s "$RUNNER_TEMP/signing/release.jks" ]; then
            echo "::error::Failed to restore release keystore"
            exit 1
          fi
          echo "Keystore restored to a temporary path (never written into the repo)."

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_FILE: ${{ runner.temp }}/signing/release.jks
        run: |
          cat > "$RUNNER_TEMP/signing/signing.properties" <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$RUNNER_TEMP/signing/signing.properties"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint and typecheck
        run: npm run lint
      - name: Kotlin comment guard (no nested block comments)
        run: node scripts/check-kotlin-comments.mjs
      - name: Auth + security tests
        run: npm test
      - name: Build Web App
        run: npm run build
      - name: Write native integrity anchor
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('dist/integrity.json','utf8')).root;fs.mkdirSync('android/app/src/main/res/raw',{recursive:true});fs.writeFileSync('android/app/src/main/res/raw/integrity_root.txt', r);console.log('anchor root:', r);"
      - name: Secret-scan gate (fail on leaked secret/token)
        run: |
          if grep -rInE "client_secret=[^&\"'[:space:]]+|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36}" dist 2>/dev/null; then
            echo "::error::Secret or token pattern found in build output"; exit 1
          fi
          echo "No secret patterns found in dist/."
      - name: Copy Web App into Android assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/

      # FIX 1: stamp the real version so the APK name and the installed app's
      # reported version both match the release tag.
      - name: Stamp version into build.gradle
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          echo "Stamped version:"
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build signed Release APK
        working-directory: android
        env:
          SIGNING_PROPERTIES_FILE: ${{ runner.temp }}/signing/signing.properties
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: Locate Release APK
        id: apk
        working-directory: android
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not found"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Release APK: $APK"

      - name: Verify APK
        working-directory: android
        env:
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          if [ ! -s "$APK" ]; then
            echo "::error::APK is empty"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in the Android SDK build-tools"
            exit 1
          fi
          if ! "$APKSIGNER" verify --verbose "$APK"; then
            echo "BUILD FAILED — SIGNING CONFIGURATION ERROR: the APK is not signed."
            exit 1
          fi
          echo "✅ APK is signed."

      - name: Name the release APK
        working-directory: android
        env:
          APK: ${{ steps.apk.outputs.apk }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p output_apk
          cp "$APK" "output_apk/GITOFY-v${VERSION}-release.apk"
          ls -la output_apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GITOFY-release-apk
          path: android/output_apk/*.apk
          if-no-files-found: error

      # FIX 2 + 3: make sure the release exists, then delete every old *.apk
      # asset so the freshly built APK replaces it instead of piling up.
      - name: Replace old APK assets on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet — creating it."
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Release $TAG (Gitofy signed APK)" \
              --notes "Automated release."
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              *.apk)
                echo "Removing previous APK asset: $name"
                gh release delete-asset "$TAG" "$name" --yes
                ;;
            esac
          done
          echo "Old APK assets cleared for $TAG."

      - name: Publish / update GitHub Release with the new APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }} (Gitofy signed APK)
          files: android/output_apk/*.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
          draft: false
          prerelease: false

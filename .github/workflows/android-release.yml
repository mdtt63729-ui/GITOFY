name: Android Release (Signed APK)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint and typecheck (B-09)
        run: npm run lint
      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Rename & Locate Release APK
        working-directory: android
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} output_apk/gitofy-release.apk \;
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-release-apk
          path: android/output_apk/gitofy-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release with Signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/output_apk/gitofy-release.apk
          name: Release ${{ github.ref_name }} (Gitofy Android APK)
          generate_release_notes: true
          draft: false
          prerelease: false

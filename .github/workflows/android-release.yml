name: Android Release (Unsigned APK)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint and typecheck (B-09)
        run: npm run lint
      - name: Kotlin comment guard (no nested block comments)
        run: node scripts/check-kotlin-comments.mjs
      - name: Auth unit + integration tests (PRD v2.0 §15)
        run: npm test
      - name: Build Web App
        run: npm run build
      - name: Write native integrity anchor
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('dist/integrity.json','utf8')).root;fs.mkdirSync('android/app/src/main/res/raw',{recursive:true});fs.writeFileSync('android/app/src/main/res/raw/integrity_root.txt', r);console.log('anchor root:', r);"
      - name: Secret-scan gate (fail on leaked secret/token)
        run: |
          if grep -rInE "client_secret=[^&\"'[:space:]]+|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36}" dist 2>/dev/null; then
            echo "::error::Secret or token pattern found in build output"; exit 1
          fi
          echo "No secret patterns found in dist/."
      - name: Copy Web App into Android assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/
      - name: Build Unsigned Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace --no-daemon
      - name: Rename & Locate Release APK
        working-directory: android
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/release -name "*-unsigned.apk" -print -quit | xargs -r -I{} cp "{}" output_apk/gitofy-release-unsigned.apk
          test -f output_apk/gitofy-release-unsigned.apk
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-release-unsigned-apk
          path: android/output_apk/gitofy-release-unsigned.apk
          if-no-files-found: error
      - name: Publish GitHub Release with Unsigned APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/output_apk/gitofy-release-unsigned.apk
          name: Release ${{ github.ref_name }} (Gitofy Unsigned Android APK)
          generate_release_notes: true
          draft: false
          prerelease: false

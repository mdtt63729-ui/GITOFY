name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint and typecheck (B-09)
        run: npm run lint
      - name: Auth unit + integration tests (PRD v2.0 §15)
        run: npm test
      - name: Build Web App
        run: npm run build
      - name: Secret-scan gate (fail on leaked secret/token)
        run: |
          if grep -rInE "client_secret=[^&\"'[:space:]]+|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{36}" dist 2>/dev/null; then
            echo "::error::Secret or token pattern found in build output"; exit 1
          fi
          echo "No secret patterns found in dist/."
      - name: Copy Web App into Android assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/
      - name: Build Unsigned Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace --no-daemon
      - name: Upload Unsigned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitofy-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: warn
